      <main style="max-width:720px;margin:48px auto;padding:0 20px;font-family:system-ui,sans-serif;line-height:1.6;color:#17263F">
        <h1>AquaWatt — Water &amp; Energy Monitoring with ESP32 IoT Sensors</h1>
        <p>
          AquaWatt is a prototype IoT platform that tracks water flow and electrical load from ESP32-based sensors
          and shows them in a single web dashboard.
        </p>
        <ul>
          <li>Water flow monitoring from an ESP32 with an FS-S401 flow sensor</li>
          <li>Dashboard with usage history and anomaly alerts</li>
          <li>AI assistant powered by Google Gemini</li>
          <li>Read-only Model Context Protocol (MCP) server for tools, resources and prompts</li>
          <li>Electrical monitoring with an INA219 module (calibration in progress)</li>
        </ul>
        <p>Built with React, TypeScript, Vite, Express, Supabase and PostgreSQL. This site needs JavaScript for the interactive dashboard.</p>
